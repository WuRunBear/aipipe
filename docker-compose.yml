# aipipe 一键部署（M1 骨架）。主机需已安装 docker CLI 且 daemon 可访问。
# 说明：执行器通过挂载的 docker.sock 调用宿主 docker；PIPELINES_DIR/DATA_DIR
# 必须为宿主机路径（docker run 的 -v 由宿主守护进程解析），故用 ${PWD} 注入。
services:
  aipipe:
    image: python:3.11-slim
    command: >
      sh -c "pip install -r /repo/server/requirements.txt &&
             uvicorn server.main:app --host 0.0.0.0 --port 8000"
    working_dir: /repo
    volumes:
      - ./:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AIPIPE_PIPELINES_DIR=${PWD}/pipelines
      - AIPIPE_DATA_DIR=${PWD}/data
    ports:
      - "8000:8000"
    restart: unless-stopped
